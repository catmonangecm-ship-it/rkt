<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>KrylIOS Status</title>
  <style>
    :root {
      --bg: #020617;
      --card-bg: #050816;
      --accent: #22c55e;
      --accent-soft: rgba(34,197,94,0.12);
      --text-main: #e5e7eb;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #0b1120 0, #020617 55%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
    }

    .wrapper {
      width: 420px;
      padding: 24px;
      border-radius: 20px;
      background: linear-gradient(145deg, #020617 0, #050816 40%, #020617 100%);
      box-shadow: 0 24px 60px rgba(0,0,0,0.85);
      border: 1px solid rgba(148,163,184,0.18);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand-title {
      font-size: 22px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9ca3af;
    }

    .brand-sub {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #bbf7d0;
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(34,197,94,0.9);
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .server-card {
      border-radius: 14px;
      padding: 12px 14px;
      background: rgba(15,23,42,0.85);
      border: 1px solid rgba(75,85,99,0.6);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .server-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .server-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--text-muted);
    }

    .server-ip {
      font-size: 16px;
      font-weight: 500;
      color: var(--text-main);
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #4b5563;
      margin-top: 6px;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148,163,184,0.4);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #4b5563;
      display: flex;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="brand">
        <div class="brand-title">KrylIOS</div>
        <div class="brand-sub">Server status panel</div>
      </div>
      <div class="status-pill">
        <span class="dot"></span>
        <span>Online</span>
      </div>
    </div>

    <div class="section-title">Primary node</div>

    <div class="server-card">
      <div class="server-row">
        <span class="server-label">Server IP</span>
        <span class="server-ip">159.195.192.103</span>
      </div>
      <div class="meta-row">
        <span>Last check: now</span>
        <span class="badge">KRYLIOS · FR</span>
      </div>
    </div>

    <div class="footer">
      <span>Heartbeat: 1.2s · All systems nominal</span>
    </div>
  </div>
</body>
</html>
