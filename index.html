<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>FENIX440 – Strategy Panel</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation"></script>
<style>
  body {
    margin: 0;
    background: #0b0f19;
    font-family: Arial, sans-serif;
    color: #e5e7eb;
    display: flex;
  }

  .sidebar {
    width: 260px;
    background: #111827;
    padding: 20px;
    border-right: 1px solid #1f2937;
  }

  .sidebar h2 {
    margin: 0 0 20px;
    font-size: 18px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9ca3af;
  }

  .stat {
    margin-bottom: 14px;
    padding: 10px;
    background: #1f2937;
    border-radius: 8px;
  }

  .stat-title {
    font-size: 12px;
    color: #6b7280;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 4px;
  }

  .main {
    flex: 1;
    padding: 20px;
  }

  canvas {
    width: 100%;
    height: 300px;
    margin-bottom: 20px;
  }

  .trade-log {
    margin-top: 20px;
    background: #111827;
    padding: 12px;
    border-radius: 8px;
  }

  .trade-log h3 {
    margin: 0 0 10px;
    font-size: 14px;
    text-transform: uppercase;
    color: #9ca3af;
  }

  .trade-item {
    padding: 6px 0;
    border-bottom: 1px solid #1f2937;
    font-size: 13px;
  }

  .buy { color: #22c55e; }
  .sell { color: #ef4444; }
</style>
</head>
<body>

<div class="sidebar">
  <h2>FENIX440</h2>

  <div class="stat">
    <div class="stat-title">Net P/L</div>
    <div class="stat-value">+365.06%</div>
  </div>

  <div class="stat">
    <div class="stat-title">Max Drawdown</div>
    <div class="stat-value">46.94%</div>
  </div>

  <div class="stat">
    <div class="stat-title">Win Rate</div>
    <div class="stat-value">94%</div>
  </div>

  <div class="stat">
    <div class="stat-title">Total Trades</div>
    <div class="stat-value">94</div>
  </div>
</div>

<div class="main">

  <canvas id="chart"></canvas>
  <canvas id="rsi"></canvas>
  <canvas id="macd"></canvas>

  <div class="trade-log">
    <h3>Trade Log</h3>
    <div class="trade-item buy">[BUY] 2024-01-12 — 3.22</div>
    <div class="trade-item sell">[SELL] 2024-01-15 — 4.11</div>
    <div class="trade-item buy">[BUY] 2024-02-03 — 2.88</div>
    <div class="trade-item sell">[SELL] 2024-02-09 — 3.90</div>
  </div>
</div>

<script>
const priceData = [1.5, 2.1, 2.8, 3.9, 4.2, 3.7, 4.8, 5.5];
const labels = ["Oct", "Nov", "Dec", "Jan", "Feb", "Mar", "Apr", "May"];

// SMA simple
function SMA(data, period) {
  let sma = [];
  for (let i = 0; i < data.length; i++) {
    if (i < period) sma.push(null);
    else {
      let sum = 0;
      for (let j = i - period; j < i; j++) sum += data[j];
      sma.push(sum / period);
    }
  }
  return sma;
}

// RSI simple
function RSI(data, period = 14) {
  let gains = [], losses = [], rsi = [];
  for (let i = 1; i < data.length; i++) {
    let diff = data[i] - data[i - 1];
    gains.push(diff > 0 ? diff : 0);
    losses.push(diff < 0 ? -diff : 0);
  }
  for (let i = 0; i < data.length; i++) {
    if (i < period) rsi.push(null);
    else {
      let avgGain = gains.slice(i - period, i).reduce((a,b)=>a+b)/period;
      let avgLoss = losses.slice(i - period, i).reduce((a,b)=>a+b)/period;
      let rs = avgGain / avgLoss;
      rsi.push(100 - (100 / (1 + rs)));
    }
  }
  return rsi;
}

// MACD simple
function MACD(data) {
  const ema12 = SMA(data, 2);
  const ema26 = SMA(data, 5);
  let macd = [];
  for (let i = 0; i < data.length; i++) {
    macd.push(ema12[i] - ema26[i]);
  }
  return macd;
}

new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels,
    datasets: [
      {
        label: "Price",
        data: priceData,
        borderColor: "#3b82f6",
        borderWidth: 2,
        pointRadius: 5,
        pointBackgroundColor: ["#22c55e","#ef4444","#22c55e","#ef4444","#22c55e","#ef4444","#22c55e","#ef4444"]
      },
      {
        label: "SMA",
        data: SMA(priceData, 3),
        borderColor: "#f59e0b",
        borderWidth: 2,
        borderDash: [5,5]
      }
    ]
  },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: "#9ca3af" } },
      y: { ticks: { color: "#9ca3af" } }
    }
  }
});

new Chart(document.getElementById("rsi"), {
  type: "line",
  data: {
    labels,
    datasets: [{
      label: "RSI",
      data: RSI(priceData),
      borderColor: "#22c55e",
      borderWidth: 2
    }]
  },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      y: { min: 0, max: 100, ticks: { color: "#9ca3af" } },
      x: { ticks: { color: "#9ca3af" } }
    }
  }
});

new Chart(document.getElementById("macd"), {
  type: "line",
  data: {
    labels,
    datasets: [{
      label: "MACD",
      data: MACD(priceData),
      borderColor: "#ef4444",
      borderWidth: 2
    }]
  },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      x: { ticks: { color: "#9ca3af" } },
      y: { ticks: { color: "#9ca3af" } }
    }
  }
});
</script>

</body>
</html>
